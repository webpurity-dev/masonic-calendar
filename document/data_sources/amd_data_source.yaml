order_summary:
  title: "Grand Council of the Order of Allied Masonic Degrees of England and Wales and Districts and Councils Overseas"
  crest: "../../images/amd-logo.png"
  website: "https://www.markmasonshall.org/orders/amd"
  heads: 
    - rank: "Grand Master"
      title: "M.W.Bro."
      name: "Thomas F. Jackson"
  deputy_heads:
    - rank: "Deputy Grand Master"
      title: "R.W.Bro."
      name: "James M. Birrell"
  district_heads:
    - rank: "District Grand Prefect"
      name: "R.W.Bro. Anthony J. Green"
    - rank: "Deputy District Grand Prefect"
      name: "V.W.Bro. Laurence T. Brookes, P.G.Reg."
    - rank: "District Grand Secretary"
      name: "W.Bro. Malcolm E. W. Stevens"

order_regional_officers:  
  district_heading: "District of the Southern Counties"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "AMD"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "AMD"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "AMD"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

