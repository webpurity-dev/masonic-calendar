order_summary:
  title: "The Masonic Order of Athelstan in England, Wales and its Provinces Overseas"
  crest: "../../images/ooa-logo.png"
  website: "https://athelstan.org.uk/"
  heads: 
    - rank: "Grand Master"
      title: "MW Bro"
      name: "Charles J. Aspinell, GCAG"
  deputy_heads:
    - rank: "Deputy Grand Master"
      title: "RW Bro"
      name: "Clive Robert Manuel, GCAG"
    - rank: "Assistant Grand Master"
      title: "RW Bro"
      name: "Lionel Broadbent Mee, GCAG"
  district_heads:
    - rank: "Provincial Grand Master"
      title: "R.W.Bro."
      name: "Chris D Hallett, GCAG"
    - rank: "Deputy Provincial Grand Master"
      title: "W.Bro."
      name: "Stephen Ball"

order_regional_officers:
  district_heading: "Province of Dumnonia"
  officers_heading: "Active Provincial Officers 2026-27"
  source: "athel_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "Athel"
  override_installation_heading: "Consecration"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"

unit_officers:
  source: "athel_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Athel"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "athel_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Athel"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Joined"
      type: "int"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_members:
  source: "athel_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Athel"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"