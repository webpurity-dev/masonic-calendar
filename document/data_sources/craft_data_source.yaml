unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Craft"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Off"
      type: "string"
    - name: "PositionNo"
      csv_column: "OffPos"
      type: "int"
    # v1.6 fields
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

