order_summary:
  title: "The Provincial Grand Lodge of Dorset"
  crest: "../../images/provincial-crest-sml.jpg"
  website: "https://dorset-freemasonry.org"
  heads: 
    - rank: "Provincial Grand Master"
      title: "RWBro"
      name: "Stephen Andrew James"
      contact: "pgm@dorsetfreemasonry.info"
  deputy_heads:
    - rank: "Deputy Grand Master"
      title: "VWBro"
      name: "Mark David Burstow, PGSwdB"
      contact: "dpgm@dorsetfreemasonry.info"
    - rank: "Assistant Grand Master"
      title: "WBro"
      name: "Micheal Richard Parkes, PSGD"
      contact: "apgm@dorsetfreemasonry.info"
    - rank: "Assistant Grand Master"
      title: "WBro"
      name: "Leon Anthony Matthews, PJGD"
      contact: "apgm2@dorsetfreemasonry.info"
  district_heads: []

order_executive_officers:
  heading2: "Provincial Executive"
  source: "craft_executive_officers.csv"
  fields:
    - name: "Rank"
      csv_column: "Rank"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Contact"
      csv_column: "Contact"
      type: "string"

order_regional_officers:
  officers_heading: "Provincial Grand Lodge Officers 2025-26"
  source: "craft_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

order_succession_list:
  tables:
    - title: "PROVINCIAL GRAND MASTERS"
      source: "data/craft_pgm_succession.csv"
      font_size: "8pt"
      columns:
        - name: "Appointed"
          csv_column: "Appointed"
          width: "18%"
          alignment: "left"
        - name: "PROVINCIAL GRAND MASTERS"
          csv_column: "Name"
          width: "70%"
          alignment: "left"
        - name: "Years"
          csv_column: "Years"
          width: "12%"
          alignment: "left"
      table_caption: "† Resigned from Office. ‡ Dismissed from Office by the Grand Master."
    - title: "DEPUTY PROVINCIAL GRAND MASTERS"
      source: "data/craft_dpgm_succession.csv"
      font_size: "7pt"
      columns:
        - name: "Appointed"
          csv_column: "Appointed"
          width: "18%"
          alignment: "left"
        - name: "DEPUTY PROVINCIAL GRAND MASTERS"
          csv_column: "Name"
          width: "70%"
          alignment: "left"
        - name: "Years"
          csv_column: "Years"
          width: "12%"
          alignment: "left"
    - title: "ASSISTANT PROVINCIAL GRAND MASTERS"
      source: "data/craft_apgm_succession.csv"
      font_size: "7pt"
      columns:
        - name: "Appointed"
          csv_column: "Appointed"
          width: "18%"
          alignment: "left"
        - name: "ASSISTANT PROVINCIAL GRAND MASTERS"
          csv_column: "Name"
          width: "70%"
          alignment: "left"
        - name: "Years"
          csv_column: "Years"
          width: "12%"
          alignment: "left"

