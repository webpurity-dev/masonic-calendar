# Data source mappings for Knights Beneficent of the Holy City

order_summary:
  title: "The Grand Priory of the Knights Beneficent of the Holy City of the Rectified Scottish Rite of England and Wales"
  crest: "../../images/kbhc-logo.png"
  website: "https://www.markmasonshall.org/orders/kbhc"
  heads: 
    - rank: "GRAND MASTER"
      title: "M.Em. & Revd.Kt."
      name: "Dr Vivian Thomas, JP, G.C.H.C."
  deputy_heads:
    - rank: "Grand Prior & Deputy Grand Master"
      title: "R.Revd.Kt."
      name: "P.R Clement, G.C.H.C."
  district_heads:
    - rank: "Regional Grand Prefect"
      title: "R.Revd.Kt."
      name: "Adrian T Jones"
    - rank: "Chancellor"
      title: "Revd.Kt."
      name: "Ian C Satherley, BEM, P.G.I.Sent."

order_regional_officers:
  district_heading: "Avalon Prefecture"
  source: "kbhc_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "KBHC"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"