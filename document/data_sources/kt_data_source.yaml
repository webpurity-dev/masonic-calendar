order_summary:
  title: "The Great Priory of the United Religious, Military and Masonic Orders of the Temple and of St. John of Jerusalem, Palestine, Rhodes and Malta of England and Wales and its Provinces Overseas"
  crest: "../../images/kt-logo.png"
  website: "https://www.ktdorsetwilts.org.uk"
  heads: 
    - rank: "Grand Master"
      title: "M.E. & S.Kt."
      name: "Paul R. Clement, OStJ, G.C.T."
  deputy_heads:
    - rank: "Great Seneschal"
      title: "V.H. & R.E.Kt."
      name: "Andrew C. Rainbow, G.C.T."
  district_heads:
    - rank: "Provincial Prior"
      title: "R.E.Kt."
      name: "Richard F. Micklefield"
    - rank: "Provincial Sub-Prior"
      title: "E.Kt."
      name: "Maurice E. Lound, P.Gt.St.B.(B.)"
    - rank: "Provincial Vice-Chancellor"
      title: "E.Kt."
      name: "Brian F. Amos, P.Dep.Gt.Swd.B."

order_regional_officers:
  district_heading: "PROVINCIAL PRIORY OF DORSET AND WILTSHIRE"
  officers_heading: "Provincial Officers appointed on 30th of May 2026"
  source: "kt_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "KT"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"

unit_officers:
  source: "kt_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KT"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "kt_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KT"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Eminent Preceptors"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

