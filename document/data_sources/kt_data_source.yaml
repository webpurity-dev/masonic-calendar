  override_heading: "Joining Past Eminent Preceptors"
  units_column_heading: "Preceptories"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "PastUnits"
      csv_column: "Lodge"
