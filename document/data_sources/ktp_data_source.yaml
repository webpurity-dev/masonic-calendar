order_summary:
  title: "The Grand College of The Holy Royal Arch Knight Templar Priests and Order of Holy Wisdom"
  crest: "../../images/ktp-logo.png"
  website: "http://www.knighttemplarpriests.com"
  heads: 
    - rank: "Grand High Priest"
      title: "M Ill Kt Pt"
      name: "Christopher Gavin Maiden, GCPO"
  deputy_heads:
    - rank: "Deputy Grand High Priest and Grand High Prelate"
      title: "M Em Kt Pt"
      name: "Ian Paterson Duff, GHPA, GCPO"
    - rank: "Assistant Grand High Priest"
      title: "R Ill Kt Pt"
      name: "David Harold William Scott, GCPO"
    - rank: "Assistant Grand High Priest"
      title: "R Ill Kt Pt"
      name: "John Malcolm Berry Phillips, GCPO"
  district_heads:
    - rank: "Grand Superintendent"
      name: "tbc"

order_regional_officers:
  district_heading: "District of Dorset and Wiltshire (No. 53)"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "KTP"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KTP"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KTP"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past High Priests"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Joined"
      csv_column: "Joined"
      type: "int"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_joining_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KTP"
    - filter_field: "Mem Type"
      filter_value: "PMI"
  override_heading: "Joining Past High Priests"
  units_column_heading: "Tabernacles"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "PastUnits"
      csv_column: "Lodge"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Joined"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"


unit_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KTP"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"

unit_honorary_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "KTP"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
