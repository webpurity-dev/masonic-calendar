      name: "M Em Kt Pt Ian Paterson Duff, GHPA, GCPO"
    - rank: "Assistant Grand High Priest"
      name: "R Ill Kt Pt David Harold William Scott, GCPO"
    - rank: "Assistant Grand High Priest"
      name: "R Ill Kt Pt John Malcolm Berry Phillips, GCPO"
    - rank: "Grand Recorder"
      name: "R Ill Kt Pt G R Goddard, GCPO"
  district_heading: "District of Dorset and Wiltshire (No. 53)"
  district_heads:
    - rank: "Grand Superintendent"
      name: "tbc"
    - rank: "District Recorder"
      name: "tbc"
    - rank: "District Director of Ceremonies"
      name: "tbc"