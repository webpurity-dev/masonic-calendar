# Data source mappings for Mark Masonry section
# v1.4 format: units_v1.5.csv + membership_v1.5.csv

units:
  source: "units_v1.7.csv"
  filter_field: "Unit Type"
  filter_value: "Mark"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    # Location and What3Words now loaded from unit_locations.csv via location join

officers:
  source: "membership_v1.7.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Mark"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "OffPos"
      type: "int"
    # v1.6 fields
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

past_masters:
  source: "membership_v1.7.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Mark"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Mark Masters"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"
    # v1.6 fields
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

members:
  source: "membership_v1.7.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Mark"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Join Date"
      type: "string"
    # v1.6 fields
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

honorary_members:
  source: "membership_v1.7.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "Mark"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
