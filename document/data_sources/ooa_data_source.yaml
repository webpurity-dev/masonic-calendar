order_summary:
  title: "The Masonic Order of Athelstan in England, Wales and its Provinces Overseas"
  crest: "../../images/ooa-logo.png"
  website: "https://athelstan.org.uk/"
  heads: 
    - rank: "Grand Master"
      title: "MW Bro"
      name: "Charles J. Aspinell, GCAG"
  deputy_heads:
    - rank: "Deputy Grand Master"
      title: "RW Bro"
      name: "Clive Robert Manuel, GCAG"
    - rank: "Assistant Grand Master"
      title: "RW Bro"
      name: "Lionel Broadbent Mee, GCAG"
  district_heads:
    - rank: "Provincial Grand Master"
      title: "R.W.Bro."
      name: "Chris D Hallett, GCAG"
    - rank: "Deputy Provincial Grand Master"
      title: "W.Bro."
      name: "Stephen Ball"

order_regional_officers:
  district_heading: "Province of Dumnonia"
  officers_heading: "Active Provincial Officers 2026-27"
  source: "ooa_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "OA"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "AMD"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "OffPos"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

unit_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "AMD"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"