order_summary:
  title: "The Ancient and Masonic Order of the Scarlet Cord"
  crest: "../../images/osc-logo.png"
  website: "https://www.markmasonshall.org/orders/osc"
  heads: 
    - rank: "Grand Summus"
      title: "R.Dist.Comp."
      name: "Ian S. Currans"
  deputy_heads:
    - rank: "Deputy Grand Summus"
      title: "R.Dist.Comp."
      name: "Francis C. Spencer"
    - rank: "Assistant Grand Summus"
      title: "R.Dist.Comp."
      name: "Trevor D. Currans"
  district_heads:
    - rank: "Provincial Grand Summus"
      title: "R.Dist.Comp."
      name: "Ian R. Sullivan, V"
    - rank: "Deputy Provincial Grand Summus"
      title: "V.Dist.Comp."
      name: "Colin T. Cooper, V, P.G.Reg."
    - rank: "Assistant Provincial Grand Summus"
      title: "Dist.Comp."
      name: "Laurence T. Brookes, V, P.A.G.D.C."
    - rank: "Provincial Grand Recorder"
      title: "Dist.Comp."
      name: "David J. W. Willcock, V, P.G.Swd.B."

order_regional_officers:
  district_heading: "Province of Somerset and Dorset"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "OSC"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "OSC"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "OSC"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Presidents"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_joining_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "OSC"
    - filter_field: "Mem Type"
      filter_value: "PMI"
  override_heading: "Joining Past Presidents"
  units_column_heading: "Chapters"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "PastUnits"
      csv_column: "Lodge"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Joined"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "Installed"
      csv_column: "Installed"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "OSC"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"

unit_honorary_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "OSC"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"