  heads: 
    - rank: "Grand Supreme Ruler"
      name: "M.Wy.Bro. Andrew C. Sweeney"
  deputy_heads:
    - rank: "Deputy Grand Supreme Ruler"
      name: "R.Wy.Bro. Keith B. Ferguson"
    - rank: "Assistant Grand Supreme Ruler"
      name: "R.Wy.Bro. G. Llewellyn Gill"
  district_heading: "Province of Dorset and Wiltshire"
