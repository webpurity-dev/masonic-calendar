      title: "M.W. Bro."
      name: "Raymond S. Ellis, VII°"
    - rank: "3rd Grand Master Mason"
      title: "M.W. Bro."
      name: "Graham L. Flight, VII°"
  district_heads:
    - rank: "Deputy Grand Master Mason"
      name: "RtWBro Derek Alan Mills VII°"
    - rank: "Deputy Master Mason VI°"
      name: "RtWBro Matthew R Burt VII°"
    - rank: "Deputy Master Mason V°"
      name: "RtWBro Roger W Freeman VII°"
    - rank: "Super Intendent of Work"
      name: "WBro John C Penpraze VI°"
    - rank: "Clerk"
      name: "WBro Richard F Micklefield VI°"
    - rank: "Treasurer "
