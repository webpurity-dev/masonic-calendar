order_summary:
  title: "The Worshipful Society of Free Masons - Rough Masons, Wallers, Slaters, Paviors, Plaisterers and Bricklayers"
  crest: "../../images/pbq-logo.png"
  website: "https://www.theoperatives.org"
  heads: 
    - rank: "1st Grand Master Mason"
      title: "M.W. Bro."
      name: "Paul P. Mycock, VII°"
  deputy_heads:
    - rank: "2nd Grand Master Mason"
      title: "M.W. Bro."
      name: "Raymond S. Ellis, VII°"
    - rank: "3rd Grand Master Mason"
      title: "M.W. Bro."
      name: "Graham L. Flight, VII°"
  district_heads:
    - rank: "Deputy Grand Master Mason and Senior Passed Master"
      name: "tbc"

order_regional_officers:
  district_heading: "South Western Counties Region"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "PBQ"
  hide_unit_number: true
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

