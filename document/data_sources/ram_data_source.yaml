order_summary:
  title: "The Ancient and Honourable Fraternity of Royal Ark Mariner"
  crest: "../../images/ram-logo.png"
  website: "http://www.dorsetmark.org.uk"
  heads: 
    - rank: "Grand Master"
      title: "M.W.Bro."
      name: "H.R.H. Prince Michael of Kent, GCVO"
  deputy_heads:
    - rank: "Pro Grand Master"
      title: "M.W.Bro."
      name: "Paul R. Clement, OStJ"
    - rank: "Deputy Grand Master"
      title: "R.W.Bro."
      name: "Prof. Denovan K. Wilson"
    - rank: "Assistant Grand Master"
      title: "R.W.Bro."
      name: "Peter D. Williams"
    - rank: "Grand Secretary"
      title: "R.W.Bro."
      name: "Daniel Heath P.G.J.W."
    - rank: "Grand Director of Ceremonies"
      title: "W.Bro."
      name: "Christopher M. L. Davies"
  district_heads:
    - rank: "Provincial Grand Master"
      title: "R.W.Bro."
      name: "Victor H. Pomeroy"
    - rank: "Deputy Provincial Grand Master"
      title: "W.Bro."
      name: "David F. Eaton, R.A.M.G.R."
    - rank: "Provincial Grand Secretary"
      title: "W.Bro."
      name: "David L. Sandall"

order_regional_officers:
  source: "ram_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RAM"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"

unit_officers:
  source: "ram_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RAM"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "ram_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RAM"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Commanders"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"    
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"

unit_joining_past_heads:
  source: "ram_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RAM"
    - filter_field: "Mem Type"
      filter_value: "PMI"
  override_heading: "Joining Past Commanders"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Join Date"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "PastUnits"
      csv_column: "Join Unit"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"

unit_members:
  source: "ram_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RAM"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Join Date"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_honorary_members:
  source: "ram_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RAM"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"

