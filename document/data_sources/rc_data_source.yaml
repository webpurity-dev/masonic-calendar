order_summary:
  title: "Ancient and Accepted Rite"
  crest: "../../images/rc-logo.png"
  website: "https://sc33.org.uk"
  heads: 
    - rank: "Sovereign Grand Commander"
      name: "tbc"
  deputy_heads:
    - rank: "Lieutenant Grand Commander"
      name: "tbc"
    - rank: "Grand Prior"
      name: "tbc"
    - rank: "Grand Marshal"
      name: "tbc"
    - rank: "Grand Chancellor"
      name: "tbc"
  district_heads:
    - rank: "Inspector General"
      name: "tbc"
    - rank: "District Recorder"
      name: "tbc"

order_regional_officers:
  heading2: "Members of the Supreme Council 33°"
  district_heading: "District of Dorset"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RC"
  override_installation_heading: "Enthronement"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "companion_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_columns: ["Unique Ref", "ConCatLu", "Name"]  # v1.9: Fallback chain — tries each column in order, uses first non-empty value
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "Pos No"
      type: "int"

unit_members:
  source: "companion_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Type"
      filter_value: "Mem"
  override_heading: "Members - With year of joining"
  fields:
    - name: "Reference"
      csv_columns: ["Unique Ref", "ConCatLu", "Name"]  # v1.9: Fallback chain — tries each column in order, uses first non-empty value
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"
    - name: "Suffix"
      csv_column: "Suffix"
      type: "string"
    - name: "Grouping"
      csv_column: "Grouping"
      type: "string"
  caption: "Those marked † have passed this Chair"

unit_honorary_members:
  source: "companion_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_columns: ["Unique Ref", "ConCatLu", "Name"]  # v1.9: Fallback chain — tries each column in order, uses first non-empty value
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"


