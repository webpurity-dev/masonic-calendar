order_regional_officers:
  heading2: "Members of the Supreme Council 33°"
  officers_heading: "Officials of the Supreme Council"
  district_heading: "District of Dorset"
  source: "rc_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RC"
  override_installation_heading: "Enthronement"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"

unit_officers:
  source: "rc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Mem Type"
      filter_value: "Off"
  hide_not_appointed:
    - position: "Steward"
      count: 1
    - position: Guest Organist
      count: 0
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_members:
  source: "rc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  override_heading: "Members - With year of joining"
  grouping_sort_order:
    - "33°"
    - "32°"
    - "31°"
    - "30°"
    - "18°"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "Suffix"
      csv_column: "Suffix"
      type: "string"
    - name: "Grouping"
      csv_column: "Grouping"
      type: "string"
  caption: "Those marked † have passed this Chair"

unit_honorary_members:
  source: "rc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RC"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"