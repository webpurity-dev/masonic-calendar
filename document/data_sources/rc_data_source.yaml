order_summary:
  title: "Ancient and Accepted Rite"
  crest: "../../images/rc-logo.png"
  website: "https://sc33.org.uk"
  heads: 
    - rank: "Sovereign Grand Commander"
      name: "tbc"
  deputy_heads:
    - rank: "Lieutenant Grand Commander"
      name: "tbc"
    - rank: "Grand Prior"
      name: "tbc"
    - rank: "Grand Marshal"
      name: "tbc"
    - rank: "Grand Chancellor"
      name: "tbc"
  district_heads:
    - rank: "Inspector General"
      name: "tbc"
    - rank: "District Recorder"
      name: "tbc"

order_regional_officers:
  heading2: "Members of the Supreme Council 33°"
  district_heading: "District of Dorset"
  source: "no_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RC"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

