# Data source mappings for Red Cross of Constantine section

order_summary:
  title: "The Grand Imperial Conclave of the Masonic and Military Order of the Red Cross of Constantine and the Orders of the Holy Sepulchre and of St. John the Evangelist in England and Wales and its Divisions and Conclaves Overseas"
  crest: "../../images/rcoc-logo.png"
  website: "https://www.markmasonshall.org/orders/rcc"
  heads: 
    - rank: "GRAND SOVEREIGN"
      name: "Graham Leslie Flight, G.C.C."
  deputy_heads:
    - rank: "DEPUTY GRAND SOVEREIGN"
      name: "Christopher John Macdonald, G.C.C."
    - rank: "GRAND EUSEBIUS"
      name: "Rev. Timothy John Nicholas L'Estrange, G.C.C."
  district_heads:
    - rank: "INTENDANT-GENERAL"
      title: "Rt. Ill. Kt."
      name: "Alan Curley"
    - rank: "DEPUTY INTENDANT-GENERAL"
      title: "Ill. Kt."
      name: "Barry Keith Hobbs"

order_regional_officers:
  district_heading: "Division of Dorset and Wiltshire"
  officers_heading: "Divisional Officers 2025-26"
  source: "rcoc_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"  

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RCOC"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

unit_officers:
  source: "rcoc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RCOC"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "rcoc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RCOC"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Sovereigns"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"    
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"

unit_joining_past_heads:
  source: "rcoc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RCOC"
    - filter_field: "Mem Type"
      filter_value: "PMI"
  override_heading: "Joining Past Sovereigns"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "PastUnits"
      csv_column: "Join Unit"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"

unit_members:
  source: "rcoc_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RCOC"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Join Date"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

