order_summary:
  title: "Royal Order of Scotland. The King of Scots hereditary Grand Master"
  crest: "../../images/ros-logo.png"
  website: "https://www.royalorderscotland.org"
  heads: 
    - rank: "Deputy Grand Master and Governor"
      title: "Bro."
      name: "Ewan Rutherford"
  district_heads: 
    - rank: "Right Worshipful Provincial Grand Master"
      title: "Bro."
      name: "Paul M. Muir"
    - rank: "Worshipful Deputy Provincial Grand Master"
      title: "Bro."
      name: "Julian Mitchell"
    - rank: "Worshipful Substitute Provincial Grand Masters"
      title: "Bro."
      name: "Barry K. Hobbs"

order_regional_officers:
  district_heading: "Provincial Grand Lodge of Dorset"
  officers_heading: "Officers of the Royal Order of Scotland Province of Dorset"
  source: "ros_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "ROS"
  hide_unit_number: true
  hide_unit_name: true
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"

unit_past_heads:
  source: "ros_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "ROS"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: ""
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"    
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"

unit_members:
  source: "ros_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "ROS"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  grouping_sort_order:
    - "Founder"
    - "2001"
    - "2002"
    - "2003"
    - "2004"
    - "2005"
    - "2006"
    - "2007"
    - "2008"
    - "2009"
    - "2010"
    - "2011"
    - "2012"
    - "2013"
    - "2014"
    - "2015"
    - "2016"
    - "2017"
    - "2018"
    - "2019"
    - "2020"
    - "2021"
    - "2022"
    - "2023"
    - "2024"
    - "2025"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "Title"
      csv_column: "Title"
      type: "string"
    - name: "Suffix"
      csv_column: "Suffix"
      type: "string"
    - name: "Grouping"
      csv_column: "Grouping"
      type: "string"
