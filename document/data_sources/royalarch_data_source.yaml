# Data source mappings for Royal Arch section
# CSV files and column mappings that support royal arch related data
# v1.4 format: units_v1.5.csv + membership_v1.5.csv

order_summary:
  title: "The Provincial Grand Chapter of Dorset"
  crest: "../../images/ra-logo.png"
  website: "https://dorset-freemasonry.org/"
  heads:
    - rank: "Grand Superintendent"
      title: "E Comp"
      name: "Stephen Andrew James"
      contact: "gsupt@dorsetfreemasonry.info"
  deputy_heads:
    - rank: "Deputy Grand Superintendent"
      title: "E Comp"
      name: "Mark Christopher Hinsley, PAGDC"
      contact: "dpgsupt@dorsetfreemasonry.info"
    - rank: "Second Grand Principal"
      title: "E Comp"
      name: "Kevin Abbiss, PAGDC"
      contact: "2ndprgprinc@dorsetfreemasonry.info"
    - rank: "Third Grand Principal"
      title: "E Comp"
      name: "Nigel Melville Douglas House, PAGDC"
      contact: "3rdprgprinc@dorsetfreemasonry.info"
  district_heads: []

order_executive_officers:
  heading2: "Provincial Executive"
  source: "royalarch_executive_officers.csv"
  fields:
    - name: "Rank"
      csv_column: "Rank"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Contact"
      csv_column: "Contact"
      type: "string"

order_regional_officers:
  officers_heading: "Provincial Grand Chapter Officers 2025-26"
  source: "royalarch_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

order_succession_list:
  tables:
    - title: "GRAND SUPERINTENDENTS"
      source: "royalarch_megs_succession.csv"
      font_size: "8pt"
      columns:
        - name: "Appointed"
          csv_column: "Appointed"
          width: "18%"
          alignment: "left"
        - name: "GRAND SUPERINTENDENTS"
          csv_column: "Name"
          width: "70%"
          alignment: "left"
        - name: "Years"
          csv_column: "Years"
          width: "12%"
          alignment: "left"
    - title: "DEPUTY GRAND SUPERINTENDENTS"
      source: "royalarch_degs_succession.csv"
      font_size: "7pt"
      columns:
        - name: "Appointed"
          csv_column: "Appointed"
          width: "18%"
          alignment: "left"
        - name: "DEPUTY GRAND SUPERINTENDENTS"
          csv_column: "Name"
          width: "70%"
          alignment: "left"
        - name: "Years"
          csv_column: "Years"
          width: "12%"
          alignment: "left"

order_member_stats:
  source: "royalarch_stats.csv"
  fields:
    - name: "LodgeCode"
      csv_column: "Lc no"
      type: "string"
    - name: "MembershipsStart"
      csv_column: "Mships start"
      type: "int"
    - name: "MembershipsEnd"
      csv_column: "Mships end"
      type: "int"
    - name: "Difference"
      csv_column: "Difference"
      type: "int"
    - name: "Resigned"
      csv_column: "Resigned"
      type: "int"
    - name: "Honorary"
      csv_column: "Honorary"
      type: "int"
    - name: "Cessation"
      csv_column: "Cessation"
      type: "int"
    - name: "Exclusion"
      csv_column: "Exclusion"
      type: "int"
    - name: "Deceased"
      csv_column: "Deceased"
      type: "int"
    - name: "InitiateExaltee"
      csv_column: "Initiate exaltee"
      type: "int"
    - name: "Joiner"
      csv_column: "Joiner"
      type: "int"
    - name: "Rejoiner"
      csv_column: "Rejoiner"
      type: "int"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "RA"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    # Location and What3Words now loaded from unit_locations.csv via location join

unit_officers:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RA"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "OffPos"
      type: "int"

unit_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RA"
    - filter_field: "Mem Type"
      filter_value: "PMEZ"
  override_heading: "Past First Principals"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"    
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    # v1.6 fields
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

unit_joining_past_heads:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RA"
    - filter_field: "Mem Type"
      filter_value: "JPMEZ"
  override_heading: "Joining Past First Principals"
  units_column_heading: "Chapters"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Join Date"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "PastUnits"
      csv_column: "Join Unit"
      type: "string"
    # v1.6 fields
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "string"
    # v1.7 NEW: Other Province Rank
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    # v1.7 NEW: London Rank
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

unit_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RA"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Join Date"
      type: "string"

unit_honorary_members:
  source: "membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "RA"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"