order_summary:
  title: "The Grand Council of the Order of Royal and Select Masters of England and Wales and its Districts and Councils Overseas"
  crest: "../../images/rsm-logo.png"
  website: "https://dorset-hants-rsm.org/"
  heads: 
    - rank: "GRAND MASTER"
      title: "M.Ill.Comp."
      name: "Kessick J. Jones, IX"
  deputy_heads:
    - rank: "Deputy Grand Master"
      title: "R.Ill.Comp."
      name: "Paul A. Norman, IX"
    - rank: "Grand Principal Conductor of the Work"
      title: "R.Ill. Comp."
      name: "Norman Dunkeld Milburn, 1X"
  district_heads:
    - rank: "District Grand Master"
      title: "R.Ill. Comp."
      name: "Frank J. Shaw"
    - rank: "District Grand Master Designate"
      title: "V.Ill. Comp."
      name: "Peter R. Dack, P.G.Lect."
    - rank: "Deputy District Grand Master"
      title: "Ill. Comp."
      name: "Simon P. Lancaster, P.G.Cond.C."
    - rank: "District Grand Principal Conductor of the Work"
      title: "Ill. Comp."
      name: "Clive B. Egerton, P.Capt.Gd."

order_regional_officers:
  district_heading: "District of Dorset, Hampshire and Isle of Wight"
  officers_heading: "Officers appointed on 29th August 2026"
  source: "rsm_officers_v1.7.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units_v1.7.csv"
  filter_field: "Unit Type"
  filter_value: "RSM"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

