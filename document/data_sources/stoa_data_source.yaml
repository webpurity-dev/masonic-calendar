# Data source mappings for STOA section
# v1.7 format: units_v1.6.csv + membership_v1.7.csv

units:
  source: "units_v1.7.csv"
  filter_field: "Unit Type"
  filter_value: "STOA"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"

officers:
  source: "membership_v1.7.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "Off"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PositionNo"
      csv_column: "OffPos"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"
    - name: "ProvRankOtherProv"
      csv_column: "Prov Rank Oth Prov"
      type: "string"
    - name: "OpDateAccorded"
      csv_column: "OP Date Accorded"
      type: "string"
    - name: "LondonRank"
      csv_column: "Lndn Rank"
      type: "string"
    - name: "LondonRankDateAccorded"
      csv_column: "LR Date Accorded"
      type: "int"

