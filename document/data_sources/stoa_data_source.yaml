order_summary:
  title: "Commemorative Order of St Thomas of Acon"
  crest: "../../images/stoa-logo.png"
  website: "http://www.thomas-of-acon.org"
  heads: 
    - rank: "Most Worthy Grand Master"
      name: "Philip Andrew Hamilton Bowler"
  deputy_heads:
    - rank: "Most Eminent Grand Prior"
      name: "Harry John Randell"
    - rank: "Grand Secretary"
      name: "Derek Arthur Robert Cook"
  district_heads:
    - rank: "Grand Preceptor"
      name: "A S Clapp"
    - rank: "Provincial Grand Prior"
      name: "G MacKenzie"

order_regional_officers:
  district_heading: "Province of Wessex"
  officers_heading: "Provincial Officers"
  source: "stoa_officers.csv"
  fields:
    - name: "Office"
      csv_column: "Office"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "Unit"
      csv_column: "Unit"
      type: "string"

units:
  source: "units.csv"
  filter_field: "Unit Type"
  filter_value: "STOA"
  fields:
    - name: "Number"
      csv_column: "Unit No"
      type: "int"
    - name: "Name"
      csv_column: "Unit Name"
      type: "string"
    - name: "UnitPostfix"
      csv_column: "Unit Postfix"
      type: "string"
    - name: "ShortName"
      csv_column: "Short Name"
      type: "string"
    - name: "SuperShortName"
      csv_column: "Super Short Name"
      type: "string"
    - name: "Warrant"
      csv_column: "Warrant"
      type: "string"
    - name: "MeetingDates"
      csv_column: "Meeting Dates"
      type: "string"
    - name: "LastInstallationDate"
      csv_column: "Last Installation"
      type: "string"
    - name: "Hall"
      csv_column: "Location"
      type: "string"
    - name: "Contact"
      csv_column: "Email"
      type: "string"
    - name: "BreakBeforeMembers"
      csv_column: "Break Before Members"
      type: "bool"
    - name: "BreakBeforeJoiningMembers"
      csv_column: "Break Before Joining Members"
      type: "bool"

unit_officers:
  source: "stoa_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "Off"
  hide_not_appointed:
    - position: "Cellarer"
      count: 1
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"   
    - name: "Position"
      csv_column: "Office"
      type: "string"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_past_heads:
  source: "stoa_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "PMO"
  override_heading: "Past Worthy Masters"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInstalled"
      csv_column: "Installed"
      type: "string"    
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_joining_past_heads:
  source: "stoa_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "PMI"
  override_heading: "Joining Past Worthy Masters"
  units_column_heading: "Chapels"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "PastUnits"
      csv_column: "Lodge"
      type: "string"
    - name: "JoinedDate"
      csv_column: "Installed"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "DateRankAccorded"
      csv_column: "Date Accorded"
      type: "int"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"
    - name: "GrandRankDateAccorded"
      csv_column: "GR Date Accorded"
      type: "int"

unit_members:
  source: "stoa_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "Mem"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "YearInitiated"
      csv_column: "Joined"
      type: "int"
    - name: "PosNo"
      csv_column: "Pos No"
      type: "int"

unit_honorary_members:
  source: "stoa_membership.csv"
  filters:
    - filter_field: "Unit Type"
      filter_value: "STOA"
    - filter_field: "Mem Type"
      filter_value: "Hon"
  fields:
    - name: "Reference"
      csv_column: "Unique Ref"
      type: "string"
    - name: "Name"
      csv_column: "Name"
      type: "string"
    - name: "ProvincialRank"
      csv_column: "Provincial Rank"
      type: "string"
    - name: "GrandRank"
      csv_column: "Grand Rank"
      type: "string"