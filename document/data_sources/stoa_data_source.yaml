      csv_column: "Unit"
      type: "string"
  heading1: "Commemorative Order of St Thomas of Acon"
  crest: "../../images/stoa-logo.png"
  website: "http://www.thomas-of-acon.org"
  heads: 
    - rank: "Most Worthy Grand Master"
      name: "tbc"
  deputy_heads:
    - rank: "Most Eminent Grand Prior"
      name: "tbc"
    - rank: "Grand Secretary"
      name: "tbc"
  district_heading: "Province of Wessex"
  district_heads:
    - rank: "Grand Preceptor"
      name: "tbc"
    - rank: "Provincial Grand Prior"
      name: "tbc"
  # "Erected and Consecrated on 5 October 1999. Meet at the Kinson Masonic Hall, Ferncroft Road, Bournemouth on the second Saturday in January, the first Saturday in May and the second Saturday in August."
  officers_heading: "Officers appointed 2025-26"