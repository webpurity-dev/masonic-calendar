document:
  format: "A6"              
    # A6 trim size is 105 × 148 mm.
    # The 111 × 154 mm media page is A6 plus 3 mm bleed on every edge:
    # 105 + 6 = 111 mm
    # 148 + 6 = 154 mm
  version: "2.4.5"
  data_corrected_date: "25th July 2026"
  orientation: "portrait"
  global_styling:
    fonts:
      default_family: "Tahoma, Arial, sans-serif"
      sizes:
        title: "14pt"
        heading_primary: "12pt"
        heading_secondary: "10pt"
        heading_tertiary: "9pt"
        body: "8pt"
        dense_table: "7pt"
        secondary: "6pt"
    footer:
      font_family: "Tahoma, Arial, sans-serif"
      font_size: "6pt"
      text_align: "center"

# UI Preferences - configurable display behavior and labels
ui_preferences:
  # Remove space from initial if the member's name is longer than this threshold (in characters).
  member_name_initials_compact_threshold: 20
  order_officers_display:
    # Split long officers lists according to whether heading1 shares the page
    rows_per_table_with_heading: 36
    rows_per_table_without_heading: 38
  officer_display:
    # Display text for vacant officer positions
    not_appointed_label: "Not appointed"
    # Officers with this exact name will not be displayed
    hide_officer_with_name: "Ignore"
    # Hide officer positions if they are vacant
    hide_officer_if_vacant:
      - unit_type: "Craft"
        officers: ["Org"]
      - unit_type: "RA"
        officers: ["Org"]
  joining_past_masters_display:
    # Split long joining past master lists into page-sized tables
    rows_per_table: 40
    # Maximum number of joining units to display
    joining_units_threshold: 1
    # Display only the first threshold units and hide the remainder
    hide_exceeded_joining_units: true
    # Consolidate the full list if hiding is disabled and the threshold is exceeded   
    consolidate_exceeded_joining_units: false
    consolidate_text: "X unit(s)"
  honorary_members_display:
    # Display a rank beneath the name when it exceeds this many characters.
    rank_wrap_threshold: 10
  member_display:
    # Split only Lodge 3366 into balanced three-column member pages.
    page_limits:
      - unit_type: "Craft"
        unit_number: 3366
        rows_per_page: 34
  table_pagination:
    meetings_table_rows_per_page: 25
    membership_statistics_rows_per_page: 24
    all_units_index_rows_per_page: 48
    meetings_table_heading_spacing: "14px"
  rank_display:
    priority_order:
      - "grand_rank"                     # Grand Rank (highest priority)
      - "provincial_rank"                # Provincial Rank
      - "prov_rank_other_prov"           # Provincial Rank from Other Province
      - "london_rank"                    # London Rank (lowest priority)
    display_provincial_and_grand_rank:
      - unit_type: "Craft"
        provincial_ranks:
          - "DepProvGM"
          - "AsstProvGM"
          - "PDepProvGM"
          - "PAsstProvGM"
      - unit_type: "RA"
        provincial_ranks:
          - "DepGSupt"
          - "2ndProvGPrin"
          - "3rdProvGPrin"
          - "PDepGSupt"
          - "P2ndProvGPrin"
          - "P3rdProvGPrin"
    show_dates:
      past_masters: true                 # Include dates with past master ranks
      joining_past_masters: true         # Include dates with joining past master ranks
      honorary_members: false            # Honorary members show rank only, no dates

# Page margins for HTML rendering and proofing
# These are applied directly to the @page CSS rules
# The HTML output serves as a proof before final PDF generation in Scribus.
# Page size: A6 (105mm × 148mm) with print-safe binding margins on alternating sides.

page_margins:
  page_size: "111mm 154mm"  # A6 trim (105 x 148mm) plus 3mm bleed on every edge
  right_page:               # Odd pages (Recto)
    top:    5mm             # 3mm bleed + 2mm trim-relative margin
    bottom: 9mm             # 3mm bleed + 5mm inner margin for page numbers
    left:   9mm             # 3mm bleed + 6mm inner margin for binding edge
    right:  4mm             # 3mm bleed + 1mm outer margin
  left_page:                # Even pages (Verso)
    top:    5mm             # 3mm bleed + 7mm trim-relative margin
    bottom: 9mm             # 3mm bleed + 9mm inner margin for page numbers
    left:   4mm             # 3mm bleed + 8mm outer margin
    right:  9mm             # 3mm bleed + 6mm inner margin for binding edge
  first_page:               # Cover page - no page number, no margins
    top: 0mm
    bottom: 0mm
    left: 0mm
    right: 0mm
  crop_marks:
    trim_inset: 3mm         # A6 trim boundary within the 3mm bleed area
    mark_length: 5mm
    corner_gap: 3mm
    stroke_width: 0.15px
    color: black
    margin_color: red

page_styles:
  - name: "full_bleed_no_footer"
    margins:
      top: 0mm
      bottom: 0mm
      left: 0mm
      right: 0mm
    show_page_number: false

